name: Deploy Production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pyGSWhxVi7lzHfu3BUc5yIGt
      VERCEL_PROJECT_ID: prj_8e2ZWJZtIudKrtgOKpUpaswxNDTP

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pin the personal Vercel project
        run: node -e "const fs=require('fs'); fs.mkdirSync('.vercel',{recursive:true}); fs.writeFileSync('.vercel/project.json',JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))"

      - name: Pull Production configuration
        run: vercel pull --yes --environment=production

      - name: Build the Production artifact
        run: vercel build --prod

      - name: Deploy the verified artifact
        run: vercel deploy --prebuilt --prod --yes

      - name: Verify Production health
        env:
          PRODUCTION_BASE_URL: https://youtube-idea-factory-sepia.vercel.app
        run: |
          node <<'NODE'
          const baseUrl = process.env.PRODUCTION_BASE_URL;

          async function readJson(path) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: "application/json" },
            });
            if (!response.ok) {
              throw new Error(`${path} returned HTTP ${response.status}`);
            }
            return response.json();
          }

          const deployment = await readJson("/api/health/deployment");
          if (!deployment?.readiness || !["ready", "blocked"].includes(deployment.status)) {
            throw new Error("Deployment health response has an invalid shape");
          }
          if (deployment.readiness.runtime?.appStorageMode !== "supabase") {
            throw new Error("Production storage mode is not Supabase");
          }
          if (deployment.readiness.supabase?.readyForServerAdapters !== true) {
            throw new Error("Supabase server adapters are not ready");
          }

          const orca = await readJson("/api/health/orca");
          if (orca?.status !== "healthy" || orca?.backend !== "supabase") {
            throw new Error("Orca Supabase control plane is not healthy");
          }

          console.log(`Deployment health: ${deployment.status}`);
          console.log("Storage health: supabase-ready");
          console.log("Orca health: healthy (supabase)");
          NODE
